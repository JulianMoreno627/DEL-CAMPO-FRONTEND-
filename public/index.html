<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Del Campo · Comercio directo campesino–consumidor</title>
  <meta name="description" content="Compre directo al campesino: los productores publican lo que cultivan y usted lo compra.">
  <meta name="theme-color" content="#ffffff">
  <!-- Backend URL (another repository). It can be changed without rebuilding. -->
  <meta name="api-url" content="https://del-campo-backend.onrender.com">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <!-- Preload of the main module: the browser downloads it in parallel with the CSS -->
  <link rel="modulepreload" href="/js/main.js">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <!-- App shell (PWA pattern): this structure is cached and painted instantly, even without signal.
       The content of #view is rendered on the client (CSR). -->
  <header class="topbar">
    <a class="brand" href="#/"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15"/><path d="M5 19c3-4 6-7 10-9"/></svg>Del Campo</a>
    <div id="account" class="account"></div>
  </header>
  <!-- The sections depend on the profile used to log in (producer or buyer) -->
  <nav id="nav" class="nav" aria-label="Secciones" hidden></nav>
  <main id="view" class="content">
    <p class="loading">Cargando…</p>
  </main>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript>Esta aplicación necesita JavaScript.</noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
